name: Update Nodes

on:
  schedule:
    # 每 4 小时执行一次（UTC）
    - cron: '17 */4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '跳过真实代理检测（仅验证链路）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-nodes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Mihomo
        run: bash scripts/install_mihomo.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Unit tests
        run: python -m pytest -q

      - name: Collect, check and generate
        env:
          MIHOMO_BIN: ./bin/mihomo
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python -m src.main --dry-run
          else
            python -m src.main
          fi

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A output state
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: refresh nodes $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
